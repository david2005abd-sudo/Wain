name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_variant:
        description: Gradle task to run
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - assembleRelease

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
  node-version: '22'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      # The project is an Expo "managed" app: there is no android/ directory in the
      # repo. Continuous Native Generation (CNG) creates it from app.json on demand,
      # which also generates build.gradle and the Gradle wrapper.
      - name: Prebuild (expo prebuild --platform android)
        run: npx --yes expo prebuild --platform android --no-install --clean

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build APK (${{ github.event.inputs.build_variant || 'assembleDebug' }})
        working-directory: ./android
        run: ./gradlew ${{ github.event.inputs.build_variant || 'assembleDebug' }} --no-daemon --stacktrace

      - name: Collect APK paths
        id: apk
        working-directory: ./android
        run: |
          APKS=$(find app/build/outputs/apk -name '*.apk' -type f | tr '\n' ' ')
          echo "apks=$APKS" >> "$GITHUB_OUTPUT"
          echo "Found: $APKS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agon-${{ github.event.inputs.build_variant || 'assembleDebug' }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
